<div class="relative isolate w-full min-h-screen overflow-x-clip text-[var(--text-1)] selection:bg-[var(--accent)] selection:text-[#0B0B0B]">
  
  <!-- ======================================================== -->
  <!-- FIXED GLOBAL INFRASTRUCTURE BACKGROUND (STICKY UNDERNEATH)-->
  <!-- ======================================================== -->
  <app-network-bg></app-network-bg>

  <!-- ======================================================== -->
  <!-- FIXED NAVIGATION HEADER (ALWAYS VISIBLE AT TOP)          -->
  <!-- ======================================================== -->
  <div class="fixed top-0 left-0 right-0 z-50 w-full bg-[var(--bg)]/90 backdrop-blur-md border-b border-[var(--border)] shadow-xs transition-colors duration-200">
    <div class="w-full max-w-[1600px] mx-auto px-4 sm:px-8">
      <app-header (langChange)="handleLangChange($event)"></app-header>
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- FIXED QUICK TRIGGER: VIEW MY ARCHITECTURE (STICKY OVER SCROLL) -->
  <!-- ======================================================== -->
  <aside 
    class="fixed top-[62px] right-4 sm:right-8 lg:right-12 z-40 flex items-center gap-2.5 bg-[var(--bg)]/90 backdrop-blur-md px-2 py-1 rounded-md border border-[var(--border)] shadow-lg pointer-events-auto"
    aria-label="Architecture Quick Trigger"
  >
    <button 
      (click)="openArchitectureModal()"
      class="btn-view-architecture font-mono-tech text-xs font-extrabold uppercase tracking-wider px-3.5 py-1.5 rounded-sm bg-[var(--accent)] text-[#0B0B0B] hover:brightness-110 hover:scale-105 active:scale-95 transition-all cursor-pointer flex items-center gap-2 border border-[var(--accent)] shadow-xs"
      title="Open Interactive Infrastructure Architecture Diagram"
    >
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#0B0B0B] opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-[#0B0B0B]"></span>
      </span>
      <span>&gt; VIEW MY ARCHITECTURE</span>
    </button>
    <div class="font-mono-tech text-[11px] text-[var(--text-3)] border border-[var(--border)] px-2.5 py-1.5 rounded-sm bg-[var(--surface)] hidden sm:flex items-center gap-1.5">
      <span class="text-[var(--accent)] animate-pulse">●</span> 99.99% UPTIME
    </div>
  </aside>

  <!-- ======================================================== -->
  <!-- ACTIVE SCROLLSPY CHAPTER RAIL (FIXED LEFT SIDEBAR)        -->
  <!-- Đi đến đâu sáng đến đó theo vị trí viewport             -->
  <!-- ======================================================== -->
  <aside 
    class="fixed left-3 sm:left-5 top-1/2 -translate-y-1/2 z-40 hidden xl:flex flex-col items-center gap-1.5 font-mono-tech text-[11px] select-none pointer-events-auto bg-[var(--surface)]/90 backdrop-blur-md px-2 py-3.5 rounded-md border border-[var(--border)] shadow-xl"
    aria-label="Chapter Navigator"
  >
    <ng-container *ngFor="let ch of chapters; let i = index; let last = last">
      <button 
        type="button"
        (click)="scrollToChapter(ch.id)"
        [attr.title]="ch.num + ' / ' + ch.title"
        class="relative px-2 py-1 rounded transition-all duration-200 cursor-pointer flex items-center justify-center font-mono-tech"
        [ngClass]="activeChapter === ch.id 
          ? 'bg-[var(--accent)] text-[#0B0B0B] font-extrabold shadow-sm scale-110' 
          : 'text-[var(--text-3)] hover:text-[var(--text-1)] font-medium'"
      >
        <span>{{ ch.num }}</span>
      </button>

      <!-- Divider line between items -->
      <span *ngIf="!last" class="w-[1px] h-2.5 bg-[var(--border)] opacity-60"></span>
    </ng-container>
  </aside>

  <!-- ======================================================== -->
  <!-- HERO SCREEN (PAGE 1): 100vw x 100vh FULL-BLEED TOPOLOGY  -->
  <!-- Covers background completely with bg-[var(--bg)]         -->
  <!-- ======================================================== -->
  <div id="topology" class="w-full h-screen max-h-screen relative z-10 flex flex-col justify-between border-b border-[var(--border)] overflow-hidden bg-[var(--bg)] pt-[58px]">
    <!-- Center Stage: Edge-to-Edge Full-Screen Isometric Network Topology (Image 1) -->
    <main class="flex-1 w-full min-h-0 flex flex-col justify-between overflow-hidden">
      <app-global-network class="h-full w-full flex flex-col min-h-0" [lang]="lang" (viewArchitecture)="openArchitectureModal()"></app-global-network>
    </main>
  </div>


  <!-- ======================================================== -->
  <!-- SCROLLABLE PORTFOLIO FLOW (SECTIONS UNDERNEATH)           -->
  <!-- Balanced spacing without excessive voids                  -->
  <!-- ======================================================== -->
  <div class="w-full max-w-[1500px] mx-auto px-4 sm:px-6 lg:px-10 py-4 sm:py-6 space-y-8 sm:space-y-10 relative z-10">
    
    <!-- 02: My Story (Genesis & Trajectory) -->
    <section id="story">
      <app-my-story [lang]="lang" [UIResource]="UIResource"></app-my-story>
    </section>

    <!-- 03 & 04: Technical Skills Matrix & AI Automation Orchestrator -->
    <app-skills [lang]="lang"></app-skills>

    <!-- 05: Career Roadmap (6 Levels from Fresh IT to Solution Architect) & Grafana Telemetry -->
    <section id="roadmap">
      <app-roadmap [lang]="lang"></app-roadmap>
    </section>

    <!-- 06: Professional Experience (Production Timeline) -->
    <section id="experience">
      <app-experience [lang]="lang"></app-experience>
    </section>

    <!-- 07: International Credential Vault (8 Verified Certifications) -->
    <section id="credentials">
      <app-credentials [lang]="lang"></app-credentials>
    </section>

    <!-- 08: Contact Terminal & Connection Direct -->
    <section id="contact">
      <app-contact [lang]="lang"></app-contact>
    </section>

    <!-- Engineering Footer -->
    <app-footer [lang]="lang"></app-footer>
  </div>


  <!-- ======================================================== -->
  <!-- FLOATING CORNER INFRASTRUCTURE HUD MONITOR               -->
  <!-- Placed at root level to always float on top of content   -->
  <!-- ======================================================== -->
  <app-infrastructure-hud [lang]="lang"></app-infrastructure-hud>


  <!-- ======================================================== -->
  <!-- SYSTEM ARCHITECTURE BLUEPRINT MODAL                      -->
  <!-- ======================================================== -->
  <app-diagram-viewer 
    [isOpen]="isDiagramOpen" 
    [lang]="lang" 
    (close)="closeArchitectureModal()"
  ></app-diagram-viewer>

</div>
