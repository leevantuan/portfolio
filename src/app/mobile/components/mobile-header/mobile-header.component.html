<header class="w-full bg-[var(--bg)]/95 backdrop-blur-md border-b border-[var(--border)] px-3 py-2.5 flex items-center justify-between sticky top-0 z-50">
  <!-- Brand Name -->
  <a href="#" class="flex items-center gap-2 no-underline text-[var(--text-1)]">
    <span class="w-2 h-2 rounded-full bg-[var(--accent)]"></span>
    <span class="font-mono-tech text-xs font-bold tracking-tight">Le Van Tuan</span>
  </a>

  <!-- Actions: Theme, Lang, Menu -->
  <div class="flex items-center gap-1.5">
    <!-- Theme Toggle -->
    <button
      (click)="toggleTheme()"
      class="h-7 w-7 rounded border border-[var(--border)] bg-[var(--surface-2)] flex items-center justify-center text-xs text-[var(--text-1)] cursor-pointer"
      [title]="currentTheme === 'light' ? 'Switch to Dark' : 'Switch to Light'"
    >
      {{ currentTheme === 'light' ? '☀️' : '🌙' }}
    </button>

    <!-- Language Selector -->
    <select
      [ngModel]="lang"
      (ngModelChange)="onLangSelect($event)"
      class="h-7 px-1 rounded border border-[var(--border)] bg-[var(--surface-2)] text-[var(--text-1)] font-mono-tech text-[11px] cursor-pointer focus:outline-none"
    >
      <option value="VI">VN</option>
      <option value="ENG">EN</option>
      <option value="ZH">ZH</option>
    </select>

    <!-- Quick CV Button -->
    <button
      (click)="openResume()"
      class="h-7 px-2 rounded bg-[var(--accent)] text-[#0B0B0B] font-mono-tech text-[10.5px] font-bold tracking-wider uppercase border border-[var(--accent)] cursor-pointer"
    >
      CV
    </button>

    <!-- Menu Toggle Button -->
    <button
      (click)="toggleMenu()"
      class="h-7 w-7 rounded border border-[var(--border)] bg-[var(--surface-2)] flex items-center justify-center text-[var(--text-1)] text-xs font-mono-tech cursor-pointer"
      aria-label="Toggle navigation menu"
    >
      {{ isMenuOpen ? '✕' : '☰' }}
    </button>
  </div>
</header>

<!-- Mobile Navigation Drawer -->
<nav
  *ngIf="isMenuOpen"
  class="fixed top-[45px] left-0 right-0 z-40 bg-[var(--surface)] border-b border-[var(--border)] p-4 shadow-xl font-mono-tech text-xs space-y-2.5"
>
  <div class="text-[10px] text-[var(--text-3)] uppercase tracking-wider mb-2 font-bold">// QUICK NAVIGATION</div>
  <a
    href="#skills"
    (click)="closeMenu()"
    class="block py-2 px-3 rounded bg-[var(--surface-2)] border border-[var(--border)] text-[var(--text-1)] no-underline font-semibold"
  >
    [ 01. SKILLS MATRIX ]
  </a>
  <a
    href="#roadmap"
    (click)="closeMenu()"
    class="block py-2 px-3 rounded bg-[var(--surface-2)] border border-[var(--border)] text-[var(--text-1)] no-underline font-semibold"
  >
    [ 02. CAREER ROADMAP ]
  </a>
  <a
    href="#credentials"
    (click)="closeMenu()"
    class="block py-2 px-3 rounded bg-[var(--surface-2)] border border-[var(--border)] text-[var(--text-1)] no-underline font-semibold"
  >
    [ 03. CREDENTIALS ]
  </a>
  <a
    href="#experience"
    (click)="closeMenu()"
    class="block py-2 px-3 rounded bg-[var(--surface-2)] border border-[var(--border)] text-[var(--text-1)] no-underline font-semibold"
  >
    [ 04. EXPERIENCE ]
  </a>
  <a
    href="#contact"
    (click)="closeMenu()"
    class="block py-2 px-3 rounded bg-[var(--accent)] text-[#0B0B0B] border border-[var(--accent)] text-center no-underline font-bold"
  >
    &gt; LET'S CONNECT
  </a>
</nav>
