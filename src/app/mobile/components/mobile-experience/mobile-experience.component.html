<div class="w-full px-4 py-4 border-b border-[var(--border)]">
  <!-- Section Heading -->
  <div class="mb-5">
    <div class="flex items-center gap-2 font-mono-tech text-[10px] text-[var(--accent)] font-bold tracking-wider uppercase mb-1">
      <span>04 / TRACK RECORD</span>
      <span class="w-4 h-[1px] bg-[var(--accent)]"></span>
    </div>
    <h2 class="font-mono-tech text-xl sm:text-2xl font-bold text-[var(--text-1)] tracking-tight">
      {{ UIResource?.experience_experience || 'Production Work Experience' }}
    </h2>
    <p class="text-xs text-[var(--text-2)] mt-1">
      2 Years IT Systems &amp; Enterprise Networking · 1 Year Software Development &amp; Cloud.
    </p>
  </div>

  <!-- Experience Cards Stack (Clean Static Layout) -->
  <div class="space-y-4">
    <div
      *ngFor="let exp of UIResource?.experience_list; trackBy: trackByExp"
      class="p-4 rounded border border-[var(--border)] bg-[var(--surface)] shadow-xs"
    >
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 mb-2 border-b border-[var(--border)] pb-2">
        <div>
          <h3 class="font-mono-tech text-xs sm:text-sm font-bold text-[var(--text-1)]">
            {{ exp.role }}
          </h3>
          <div class="font-mono-tech text-[11px] text-[var(--accent-text)] font-semibold">
            {{ exp.company }}
          </div>
        </div>
        <span class="font-mono-tech text-[10px] px-2 py-0.5 rounded bg-[var(--surface-2)] text-[var(--text-3)] self-start sm:self-auto border border-[var(--border)]">
          {{ exp.period }}
        </span>
      </div>

      <p class="text-xs text-[var(--text-2)] leading-relaxed mb-3">
        {{ exp.desc }}
      </p>

      <!-- Highlights -->
      <div *ngIf="exp.highlights && exp.highlights.length > 0" class="space-y-2 mb-3">
        <div 
          *ngFor="let h of exp.highlights"
          class="p-2.5 rounded bg-[var(--surface-2)] border-l-2 border-[var(--accent)]"
        >
          <div class="font-mono-tech text-[11px] font-bold text-[var(--text-1)] mb-0.5">
            {{ h.title }}
          </div>
          <div class="text-[11px] text-[var(--text-2)] leading-normal">
            {{ h.desc }}
          </div>
        </div>
      </div>

      <!-- Tags -->
      <div class="flex flex-wrap gap-1">
        <span
          *ngFor="let tag of exp.tags"
          class="font-mono-tech text-[10px] px-1.5 py-0.5 rounded bg-[var(--surface-2)] text-[var(--text-3)] border border-[var(--border)]"
        >
          {{ tag }}
        </span>
      </div>
    </div>
  </div>
</div>
