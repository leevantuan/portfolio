<div class="network-bg-root">
  <!-- Edge-to-edge Blueprint Grid Pattern -->
  <div class="network-bg-grid"></div>

  <!-- Ambient Planetary Glow centered on Global Grid -->
  <div class="network-ambient-glow"></div>

  <!-- SVG Global Infrastructure Map Layer -->

      <!-- Hub Pulse Filter -->
      <filter id="net-hub-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3.5" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- Cable Flow Gradient -->
      <linearGradient id="cable-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.2" />
        <stop offset="50%" stop-color="var(--accent)" stop-opacity="0.8" />
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.2" />
      </linearGradient>
    </defs>

    <g class="hud-reticles" stroke="var(--border)" stroke-width="0.75" stroke-dasharray="2 6" opacity="0.6">

      <line x1="524" y1="0" x2="524" y2="500" />
