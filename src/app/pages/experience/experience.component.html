<section id="experience" class="py-14 border-b border-[var(--border)]">
  <!-- Section Title -->
  <div class="mb-10">
    <div class="flex items-center gap-3 font-mono-tech text-[11px] font-bold tracking-wider text-[var(--accent)] uppercase mb-2">
      <span>04 / WORK EXPERIENCE</span>
      <span class="w-8 h-[2px] bg-[var(--accent)]"></span>
    </div>
    <h2 class="font-mono-tech text-2xl sm:text-3xl md:text-4xl text-[var(--text-1)] font-bold mb-3 tracking-tight">
      {{ UIResource.experience_experience }}
    </h2>
  </div>

  <!-- Experience Cards List -->
  <div class="flex flex-col gap-6">
    <div 
      *ngFor="let exp of UIResource.experience_list; let idx = index" 
      class="p-6 sm:p-7 rounded-md border border-[var(--border)] bg-[var(--surface-2)] hover:border-[var(--accent)] transition-all"
    >
      <div class="flex flex-col md:flex-row md:items-start justify-between gap-4 mb-4 pb-4 border-b border-[var(--border)]">
        <div>
          <div class="font-mono-tech text-xs text-[var(--accent)] uppercase tracking-wider mb-1">
            EXPERIENCE // 0{{ idx + 1 }}
          </div>
          <h3 class="font-mono-tech text-xl sm:text-2xl font-bold text-[var(--text-1)]">
            {{ exp.role }}
          </h3>
          <div class="text-[var(--text-2)] text-sm mt-0.5">
            {{ exp.company }}
          </div>
        </div>

        <div class="flex items-center gap-2 flex-shrink-0">
          <span class="font-mono-tech text-xs px-3 py-1 rounded-sm bg-[var(--surface-3)] text-[var(--accent)] border border-[var(--border)] font-bold">
            {{ exp.period }}
          </span>
          <span class="font-mono-tech text-[10px] text-[var(--accent)] border border-[var(--accent)]/30 px-2 py-1 rounded-sm">
            ● VERIFIED
          </span>
        </div>
      </div>

      <!-- Description -->
      <p class="text-[var(--text-2)] text-sm sm:text-base leading-relaxed mb-5">
        {{ exp.desc }}
      </p>

      <!-- Tags -->
      <div class="flex flex-wrap gap-2">
        <span 
          *ngFor="let tag of exp.tags" 
          class="font-mono-tech text-xs px-2.5 py-1 rounded-sm bg-[var(--bg)] text-[var(--text-1)] border border-[var(--border)]"
        >
          {{ tag }}
        </span>
      </div>
    </div>
  </div>
</section>
