<section id="projects" class="py-14 border-b border-[var(--border)]">
  <!-- Section Title -->
  <div class="mb-10">
    <div class="flex items-center gap-3 font-mono-tech text-[11px] font-bold tracking-wider text-[var(--accent)] uppercase mb-2">
      <span>05 / FEATURED PROJECTS</span>
      <span class="w-8 h-[2px] bg-[var(--accent)]"></span>
    </div>
    <h2 class="font-mono-tech text-2xl sm:text-3xl md:text-4xl text-[var(--text-1)] font-bold mb-3 tracking-tight">
      {{ UIResource.project_project }}
    </h2>
  </div>

  <!-- Projects Cards List -->
  <div class="flex flex-col gap-8">
    <div 
      *ngFor="let proj of UIResource.projects; let idx = index" 
      class="p-6 sm:p-8 rounded-md border border-[var(--border)] bg-[var(--surface-2)] hover:border-[var(--accent)] transition-all"
    >
      <!-- Top Row: Number & Status -->
      <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
        <span class="font-mono-tech text-xs text-[var(--text-3)] font-bold tracking-wider uppercase">
          {{ proj.number }}
        </span>
        <span 
          class="font-mono-tech text-xs px-2.5 py-0.5 rounded-sm"
          [ngClass]="{
            'text-[var(--accent)] border border-[var(--accent)]/30 bg-[var(--accent)]/5': proj.status_type === 'completed',
            'text-[var(--warning)] border border-[var(--warning)]/30 bg-[var(--warning)]/5': proj.status_type === 'building'
          }"
        >
          {{ proj.status }}
        </span>
      </div>

      <!-- Project Name -->
      <h3 class="font-mono-tech text-2xl sm:text-3xl font-bold text-[var(--text-1)] mb-3">
        {{ proj.name }}
      </h3>

      <!-- Description -->
      <p class="text-[var(--text-2)] text-sm sm:text-base leading-relaxed mb-6">
        {{ proj.desc }}
      </p>

      <!-- Tech Stack Row -->
      <div class="mb-6">
        <div class="font-mono-tech text-[11px] text-[var(--text-3)] uppercase tracking-wider mb-2">
          TECH STACK & ARCHITECTURE:
        </div>
        <div class="flex flex-wrap gap-2">
          <span 
            *ngFor="let tag of proj.tags" 
            class="font-mono-tech text-xs px-2.5 py-1 rounded-sm bg-[var(--bg)] text-[var(--text-1)] border border-[var(--border)]"
          >
            {{ tag }}
          </span>
        </div>
      </div>

      <!-- Action Buttons & Live Demo Row -->
      <div class="flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-[var(--border)]">
        <div class="flex flex-wrap items-center gap-3">
          <!-- Direct Live Demo Button (if demo_url exists) -->
          <a
            *ngIf="proj.demo_url"
            [href]="proj.demo_url"
            target="_blank"
            rel="noopener noreferrer"
            class="h-9 px-4 rounded-sm font-mono-tech text-xs font-bold uppercase tracking-wider bg-[var(--accent)] text-[#0B0B0B] hover:brightness-110 border border-[var(--accent)] transition-all inline-flex items-center gap-2 cursor-pointer shadow-md no-underline"
          >
            <span class="text-sm">🌐</span>
            <span>VIEW LIVE DEMO ↗</span>
          </a>

          <button 
            (click)="openGithub(idx)"
            class="h-9 px-4 rounded-sm font-mono-tech text-xs font-bold uppercase tracking-wider bg-[var(--surface-3)] text-[var(--text-1)] hover:border-[var(--accent)] border border-[var(--border)] transition-all flex items-center gap-1.5 cursor-pointer shadow-sm"
          >
            <span>{{ proj.demo_url ? 'PROJECT REPO' : 'VIEW PROJECT GITHUB' }}</span>
            <span>→</span>
          </button>

          <button 
            (click)="onViewArchitecture()"
            class="h-9 px-4 rounded-sm font-mono-tech text-xs font-semibold uppercase tracking-wider bg-[var(--surface-3)] text-[var(--text-1)] hover:border-[var(--accent)] border border-[var(--border)] transition-all flex items-center gap-1.5 cursor-pointer"
          >
            <span>ARCHITECTURE BLUEPRINT</span>
            <span>⚡</span>
          </button>
        </div>

        <!-- Demo Account Credentials Box -->
        <div 
          *ngIf="proj.demo_user" 
          class="flex flex-wrap items-center gap-2.5 p-2 rounded border border-[var(--accent)]/30 bg-[rgba(126,217,87,0.06)] font-mono-tech text-xs"
        >
          <span class="text-[10px] text-[var(--text-3)] font-bold uppercase">DEMO CREDENTIALS:</span>
          <div class="flex items-center gap-1 px-2 py-0.5 rounded bg-[var(--surface)] border border-[var(--border)] text-[var(--accent-text)]">
            <span class="text-[10px] text-[var(--text-3)]">User:</span>
            <span class="font-bold font-mono">{{ proj.demo_user }}</span>
          </div>
          <div class="flex items-center gap-1 px-2 py-0.5 rounded bg-[var(--surface)] border border-[var(--border)] text-[var(--accent-text)]">
            <span class="text-[10px] text-[var(--text-3)]">Pass:</span>
            <span class="font-bold font-mono">{{ proj.demo_pass }}</span>
          </div>
          <button
            type="button"
            (click)="copyCredentials(proj.demo_user + ' / ' + proj.demo_pass, idx)"
            class="px-2 py-0.5 rounded border border-[var(--accent)]/40 hover:bg-[var(--accent)] hover:text-[#0b0b0b] text-[10px] font-mono-tech uppercase font-bold text-[var(--accent-text)] transition-colors cursor-pointer"
          >
            {{ copiedIndex === idx ? '✓ COPIED!' : '📋 COPY' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
