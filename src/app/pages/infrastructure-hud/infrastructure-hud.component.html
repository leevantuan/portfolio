<!-- Floating Corner Infrastructure HUD (Image 2 Exact High-Density Dotted Matrix) -->
<div 
  class="hud-panel fixed bottom-3 right-3 sm:bottom-4 sm:right-4 z-40 rounded-xl border border-[var(--border)] bg-[var(--surface)]/95 backdrop-blur-md shadow-2xl transition-all duration-300 select-none overflow-hidden w-[340px] max-w-[92vw]"
  [class.hud-collapsed]="isMinimized"
>
  <!-- HUD Header with Technical Notches (//) & Legend -->
  <div class="flex items-center justify-between px-3 py-2 border-b border-[var(--border)] bg-[var(--surface-2)]">
    <div class="flex items-center gap-1.5 font-mono-tech text-[10.5px] font-extrabold tracking-wider text-[var(--text-1)]">
      <span class="text-[var(--text-3)] font-normal">//</span>
      <span>GLOBAL INFRASTRUCTURE</span>
    </div>
    
    <div class="flex items-center gap-2">
      <!-- Image 2 Legend (Online 24 / Warning 1 / Offline 0) -->
      <div class="flex items-center gap-2 font-mono-tech text-[9px]">
        <div class="flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-[#22c55e]"></span>
          <span class="text-[var(--text-3)] text-[8px]">Online</span>
          <span class="font-bold text-[var(--text-1)]">24</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-[#f59e0b]"></span>
          <span class="text-[var(--text-3)] text-[8px]">Warning</span>
          <span class="font-bold text-[var(--text-1)]">1</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-[#ef4444]"></span>
          <span class="text-[var(--text-3)] text-[8px]">Offline</span>
          <span class="font-bold text-[var(--text-1)]">0</span>
        </div>
      </div>

      <!-- Minimize Button -->
      <button 
        (click)="toggleMinimize()"
        class="w-5 h-5 flex items-center justify-center font-mono-tech text-[10px] text-[var(--text-3)] hover:text-[var(--text-1)] rounded cursor-pointer transition-colors"
        [title]="isMinimized ? 'Expand Panel' : 'Minimize Panel'"
      >
        <span>{{ isMinimized ? '▢' : '—' }}</span>
      </button>
    </div>
  </div>

  <!-- HUD Body (Visible when not minimized) -->
  <div *ngIf="!isMinimized" class="p-2.5">
    <!-- SVG Map Container with Accurate High-Density Dotted Matrix World Map -->
    <div class="relative w-full aspect-[16/10] bg-[var(--bg)] rounded-lg border border-[var(--border)] overflow-hidden">

          <radialGradient id="hudBeaconGreen" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#22c55e" stop-opacity="1" />
            <stop offset="60%" stop-color="#22c55e" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Coordinate Crosshairs (+) in Map Corners -->
        <g stroke="var(--text-3)" stroke-width="0.8" class="opacity-50">

          <path d="M 20 185 L 20 195 M 15 190 L 25 190" />
