<section id="credentials" class="py-14 border-b border-[var(--border)]">
  <!-- Section Title & Description -->
  <div class="mb-10">
    <div class="flex items-center gap-3 font-mono-tech text-[11px] font-bold tracking-wider text-[var(--accent)] uppercase mb-2">
      <span>03 / CREDENTIAL VAULT</span>
      <span class="w-8 h-[2px] bg-[var(--accent)]"></span>
    </div>
    <h2 class="font-mono-tech text-2xl sm:text-3xl md:text-4xl text-[var(--text-1)] font-bold mb-3 tracking-tight">
      {{ UIResource.credentials_title }}
    </h2>
    <p class="text-[var(--text-2)] text-sm sm:text-base max-w-2xl leading-relaxed">
      {{ UIResource.credentials_desc }}
    </p>
  </div>

  <!-- 8 Certifications Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <div 
      *ngFor="let cert of UIResource.credentials" 
      class="p-5 rounded-md border border-[var(--border)] bg-[var(--surface-2)] credential-card flex flex-col justify-between"
    >
      <div>
        <!-- Top Row: Category & Status -->
        <div class="flex items-center justify-between gap-2 mb-3">
          <span class="font-mono-tech text-[10px] uppercase tracking-wider text-[var(--text-3)] bg-[var(--surface-3)] px-2 py-0.5 rounded-sm border border-[var(--border)]">
            {{ cert.category }}
          </span>
          <span class="font-mono-tech text-[10px] text-[var(--accent)] flex items-center gap-1 font-bold">
            <span class="w-1.5 h-1.5 rounded-full bg-[var(--accent)]"></span>
            VERIFIED
          </span>
        </div>

        <!-- Certification Name -->
        <div class="font-mono-tech text-2xl font-bold text-[var(--text-1)] mb-1 tracking-tight">
          {{ cert.name }}
        </div>

        <!-- Issuer -->
        <div class="text-[var(--text-2)] text-xs mb-4">
          {{ cert.issuer }}
        </div>
      </div>

      <!-- Bottom Serial / Verification Badge -->
      <div class="pt-3 border-t border-[var(--border)] flex items-center justify-between font-mono-tech text-[10px] text-[var(--text-3)]">
        <span>REF: {{ cert.code }}</span>
        <span class="text-[var(--accent)]">● ACTIVE</span>
      </div>
    </div>
  </div>
</section>
